apiVersion: v1
kind: Namespace
metadata:
  name: artifact-simulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-backend
  namespace: artifact-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artifact-backend
  template:
    metadata:
      labels:
        app: artifact-backend
    spec:
      containers:
        - name: artifact-backend
          image: artifact-simulator-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: artifact-backend-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-backend
  namespace: artifact-simulator
spec:
  type: ClusterIP
  selector:
    app: artifact-backend
  ports:
    - name: http
      port: 80
      targetPort: http
